[package]
name = "runx"
version = "0.1.0"
edition = "2021"
description = "Execute scripts, make targets, docker, compose, and release binaries from git repositories"
license = "MIT"

[[bin]]
name = "runx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
libc = "0.2"
signal-hook = "0.3"
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
